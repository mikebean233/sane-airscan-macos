# AirSane device ignore list, customised for this port.
# Installed to /usr/local/etc/airsane/ignore.conf
#
# Upstream ships:
#     escl:.*
#     airscan:.*
#
# The intent is to avoid loops: a scanner that sane-airscan reaches over
# eSCL is *already* an AirScan device, so re-exporting it through AirSane
# would advertise a second, redundant copy of a scanner macOS can see by
# itself.
#
# That reasoning only holds for sane-airscan's eSCL devices. This whole
# port exists because the M276nw speaks WSD and not eSCL, so its device
# is precisely the one we need AirSane to export -- there is no loop to
# create, because macOS cannot see a WSD scanner at all.
#
# sane-airscan names devices "airscan:e<n>:<name>" for eSCL and
# "airscan:w<n>:<name>" for WSD, so matching on that one character keeps
# the loop protection where it is warranted and lets WSD devices through.

# eSCL backends: still ignored, would be redundant with native AirScan
escl:.*
airscan:e.*
